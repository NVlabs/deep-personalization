[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-personalization"
version = "0.1.0"
description = "Framework-neutral evaluation for personalized proactive agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "NVIDIA"}]
dependencies = [
  "huggingface-hub>=0.27",
  "numpy>=1.24",
  "openai>=1.5.0",
  "opencv-python-headless>=4.8",
  "tqdm>=4.66",
  "tinker>=0.38.0",
  "tinker-cookbook>=0.6.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
managed = true
constraint-dependencies = ["pillow>=13.0.0", "aiohttp>=3.14.4", "urllib3>=2.8.0", "fsspec>=2026.6.0", "transformers>=5.17.0"]

[project.scripts]
osworld-persona = "benchmarks.osworld_persona.cli:main"
osworld-persona-synthesize = "benchmarks.osworld_persona.synthesis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*", "inference_backends*", "methods*", "training_backends*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"benchmarks.osworld_persona" = ["assets/*.json", "assets/*.txt", "README.md"]
"benchmarks.osworld_persona.synthesis" = ["README.md"]
"training_backends" = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B905"]  # Preserve existing zip behavior without requiring strict=.
